apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detector
  namespace: mlops-workshop
spec:
  predictor:
    model:
      modelFormat:
        name: sklearn
      storageUri: "pvc://model-pvc/fraud-model"
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "500m"
