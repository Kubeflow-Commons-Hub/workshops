# PIPELINE DEFINITION
# Name: fraud-workshop-pipeline
# Description: Minimal CPU-only pipeline for MLOps workshop (extend with real steps).
components:
  comp-workshop-hello:
    executorLabel: exec-workshop-hello
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-workshop-hello:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - workshop_hello
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef workshop_hello() -> str:\n    print(\"fraud workshop: KFP integration\
          \ step\")\n    return \"ok\"\n\n"
        image: python:3.11-slim-bookworm
pipelineInfo:
  description: Minimal CPU-only pipeline for MLOps workshop (extend with real steps).
  name: fraud-workshop-pipeline
root:
  dag:
    tasks:
      workshop-hello:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-workshop-hello
        taskInfo:
          name: workshop-hello
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.0
