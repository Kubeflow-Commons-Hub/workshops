# Same as ../manifests/trainjob-fraud-workshop.yaml (duplicate for discoverability).
# Replace REPLACE_NAMESPACE before apply.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: fraud-workshop-train
  namespace: REPLACE_NAMESPACE
spec:
  runtimeRef:
    name: torch-distributed
    kind: ClusterTrainingRuntime
  trainer:
    image: public.ecr.aws/docker/library/python:3.12-slim-bookworm
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        export PYTHONPATH="/workspace/out/.pypkgs:${PYTHONPATH:-}"
        mkdir -p /workspace/out/.pypkgs
        pip install --no-cache-dir -q --target /workspace/out/.pypkgs pandas
        pip install --no-cache-dir -q --target /workspace/out/.pypkgs torch --index-url https://download.pytorch.org/whl/cpu
        python /workspace/train.py
    numNodes: 1
    resourcesPerNode:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
  podTemplateOverrides:
    - targetJobs:
        - name: node
      spec:
        volumes:
          - name: workshop-training-files
            projected:
              sources:
                - configMap:
                    name: workshop-training
                    items:
                      - key: train.py
                        path: train.py
                      - key: transactions.csv
                        path: data/transactions.csv
          - name: workshop-out
            emptyDir: {}
        containers:
          - name: node
            volumeMounts:
              - name: workshop-training-files
                mountPath: /workspace
              - name: workshop-out
                mountPath: /workspace/out
